<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Buddy - Login</title>
    <!-- Google Fonts & FontAwesome for Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0b0f19;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Glowing Orbs */
        .background-blobs {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.4;
            animation: floatBlob 10s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 350px;
            height: 350px;
            background: #ff4757;
            top: -10%;
            left: -10%;
            border-radius: 50%;
        }

        .blob-2 {
            width: 400px;
            height: 400px;
            background: #3b82f6;
            bottom: -15%;
            right: -10%;
            border-radius: 50%;
            animation-delay: -5s;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.1); }
        }

        /* Glassmorphism Container */
        .login-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transform: translateY(20px);
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header Section */
        .card-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .card-header h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-header p {
            color: #94a3b8;
            font-size: 14px;
        }

        /* Tab Switcher Style (Sign In / Sign Up) */
        .tab-switcher {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 25px;
            position: relative;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #94a3b8;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            z-index: 1;
            transition: color 0.3s ease;
        }

        .tab-btn.active {
            color: #ffffff;
        }

        .tab-indicator {
            position: absolute;
            width: 50%;
            height: calc(100% - 8px);
            background: #ff4757;
            border-radius: 9px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.4);
        }

        /* Form Inputs Layout */
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.prefix-icon {
            position: absolute;
            left: 16px;
            color: #64748b;
            font-size: 15px;
            transition: color 0.3s;
        }

        .input-wrapper input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px 16px 14px 46px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-color: #ff4757;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 4px rgba(255, 71, 87, 0.15);
        }

        .input-wrapper input:focus ~ i.prefix-icon {
            color: #ff4757;
        }

        /* Password Toggle Eye Icon */
        .toggle-password {
            position: absolute;
            right: 16px;
            color: #64748b;
            cursor: pointer;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: #ffffff;
        }

        /* Primary Action Button */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            border: none;
            border-radius: 12px;
            padding: 14px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(255, 71, 87, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: #64748b;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .divider::before { margin-right: 15px; }
        .divider::after { margin-left: 15px; }

        /* Google Sign-in Button */
        .btn-google {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .btn-google img {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>

    <!-- Ambient Floating Background Elements -->
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- Main Login / Registration Card -->
    <div class="login-card">
        <div class="card-header">
            <h1>AI Study Buddy</h1>
            <p>Your Intelligent Academic & Career Partner</p>
        </div>

        <!-- Interactive Tab Switcher -->
        <div class="tab-switcher">
            <div class="tab-indicator" id="tabIndicator"></div>
            <button class="tab-btn active" id="signInTab" onclick="switchTab('signin')">Sign In</button>
            <button class="tab-btn" id="signUpTab" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Form Elements -->
        <form onsubmit="event.preventDefault();">
            <div class="input-group">
                <label id="userLabel">User ID / Email</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope prefix-icon"></i>
                    <input type="text" id="userInput" placeholder="Enter your email or ID" required>
                </div>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-lock prefix-icon"></i>
                    <input type="password" id="passwordInput" placeholder="Enter your password" required>
                    <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
        </form>

        <div class="divider">or</div>

        <button class="btn-google">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
            Sign in with Google
        </button>
    </div>

    <script>
        // Switch functionality for Sign In / Sign Up tabs
        function switchTab(type) {
            const signInTab = document.getElementById('signInTab');
            const signUpTab = document.getElementById('signUpTab');
            const tabIndicator = document.getElementById('tabIndicator');
            const submitBtn = document.getElementById('submitBtn');
            const userLabel = document.getElementById('userLabel');
            const userInput = document.getElementById('userInput');

            if (type === 'signin') {
                signInTab.classList.add('active');
                signUpTab.classList.remove('active');
                tabIndicator.style.transform = 'translateX(0%)';
                submitBtn.innerText = 'Sign In';
                userLabel.innerText = 'User ID / Email';
                userInput.placeholder = 'Enter your email or ID';
            } else {
                signUpTab.classList.add('active');
                signInTab.classList.remove('active');
                tabIndicator.style.transform = 'translateX(100%)';
                submitBtn.innerText = 'Create Account';
                userLabel.innerText = 'Full Name or Email';
                userInput.placeholder = 'Enter your name or email';
            }
        }

        // Toggle password visibility with icon animation
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('passwordInput');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Toggle eye icon class
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
