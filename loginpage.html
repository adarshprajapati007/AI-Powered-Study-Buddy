<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Login Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

.container{
    position:relative;
    width:350px;
    padding:40px;
    background:#fff;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    animation:slideUp 1s ease;
}

.container h2{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

.input-box{
    position:relative;
    margin-bottom:25px;
}

.input-box input{
    width:100%;
    padding:12px;
    border:none;
    border-bottom:2px solid #999;
    outline:none;
    background:transparent;
    font-size:16px;
}

.input-box label{
    position:absolute;
    left:0;
    top:12px;
    color:#777;
    pointer-events:none;
    transition:.3s;
}

.input-box input:focus~label,
.input-box input:valid~label{
    top:-10px;
    font-size:12px;
    color:#2196f3;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#2196f3;
    color:white;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1976d2;
    transform:scale(1.05);
}

.register{
    text-align:center;
    margin-top:15px;
}

.register a{
    color:#2196f3;
    text-decoration:none;
}

@keyframes slideUp{
    from{
        opacity:0;
        transform:translateY(50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">
    <h2>Login Form</h2>

    <div class="input-box">
        <input type="text" required>
        <label>Username</label>
    </div>

    <div class="input-box">
        <input type="password" required>
        <label>Password</label>
    </div>

    <button>Login</button>

    <div class="register">
        <p>Don't have an account?
            <a href="#">Register</a>
        </p>
    </div>
</div>

</body>
</html>
